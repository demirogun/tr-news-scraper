[project]
name = "tr-news-scraper"
version = "1.0.0.dev0"
description = "Search Turkish news archives by keyword and date range, politely."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Ogün Demir", email = "ogundemir8@gmail.com" },
  { name = "Aydoğan Avcıoğlu", email = "aydogann22@gmail.com" },
]
keywords = ["turkish", "news", "scraper", "sitemap", "robots.txt", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Natural Language :: Turkish",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = [
    "certifi>=2026.10.18",
    "idna>=3.15,<4",
    "lxml>=6.1,<7",
    "platformdirs>=4.2,<5",
    "protego>=0.7,<1",
    "requests>=2.33,<3",
    "tzdata>=2024.1",
    "urllib3>=2.7,<3",
]

[project.urls]
Homepage = "https://github.com/demirogun/tr-news-scraper"
Changelog = "https://github.com/demirogun/tr-news-scraper/blob/main/CHANGELOG.md"
Issues = "https://github.com/demirogun/tr-news-scraper/issues"

[dependency-groups]
dev = [
  "pytest>=9",
  "pytest-cov>=6",
  "requests-mock>=1.12",
  "ruff>=0.17",
  "mypy>=2.4",
  "types-requests",
  "types-lxml>=2026.2.16",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tr_news_scraper"]

[tool.hatch.build.targets.sdist]
exclude = ["/SPEC*.md", "/docs/ideas", "/docs/intent", "/tasks", "/.audit", "/.venv-lowest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W/F basics, I imports, B bugbear, UP pyupgrade, S bandit security, BLE no blind except,
# DTZ no naive datetimes, T20 no print, PT pytest style, SIM simplify, RUF ruff-specific
select = ["E", "W", "F", "I", "B", "UP", "S", "BLE", "DTZ", "T20", "PT", "SIM", "RUF"]
# Turkish text is this project's subject: dotless ı is a letter here, not a lookalike of i, and
# news headlines use typographic apostrophes.
allowed-confusables = ["ı", "’", "ʼ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "T20"]          # tests may assert and print diagnostics
"scripts/**" = ["T20"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -m 'not live' --cov --cov-report=term-missing"
markers = ["live: talks to real news sites; weekly CI only"]
testpaths = ["tests"]

[tool.coverage.run]
# Measure by path: with the src layout, matching by package name collected no data (coverage 7.17).
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 85
